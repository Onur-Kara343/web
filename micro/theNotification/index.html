<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Breaking News</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
</head>
<body>

    <!-- Hauptseite: komplett weiß mit Cookie-Banner -->
    <div class="page-container" id="pageContainer">
        <!-- Leere weiße Seite – der Cookie-Banner steht im Vordergrund -->
    </div>

    <!-- ALTMODISCHER COOKIE BANNER (90er Style) -->
    <div class="cookie-banner" id="cookieBanner">
        <div class="cookie-box">
            <div class="cookie-header">
                <span class="cookie-icon">🍪</span>
                <span class="cookie-title">COOKIE-ZUSTIMMUNG</span>
            </div>
            <p class="cookie-text">
                Diese Website verwendet Cookies, um Ihre Erfahrung zu verbessern.<br />
                Mit Klick auf <strong>„AKZEPTIEREN“</strong> stimmen Sie zu.
            </p>
            <button class="cookie-btn" id="acceptCookies">AKZEPTIEREN</button>
            <div class="cookie-footer">
                <span>🔒 Verschlüsselte Verbindung</span>
                <span>© 1998</span>
            </div>
        </div>
    </div>

    <!-- JUMPSCARE OVERLAY (nur Bild, keine Effekte) -->
    <div class="jumpscare-overlay" id="jumpscareOverlay">
        <img src="assets/jumpscare.jpg" alt="Jumpscare" id="jumpscareImage" />
        <audio id="scarySound" preload="auto">
            <source src="assets/scream.mp3" type="audio/mpeg" />
        </audio>
    </div>

    <script src="main.js"></script>
</body>
</html>
