<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo-Playground</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0ea5a4">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Fredoka:wght@600&family=Montserrat:wght@500&family=Roboto+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <header>
            <h1>🎨 Logo-Playground</h1>
            <p class="subtitle">Kreiere dein eigenes Logo – einfach &amp; kreativ</p>
        </header>

        <div class="workspace">
            <!-- Canvas-Bereich -->
            <div class="canvas-wrapper">
                <canvas id="canvas" width="600" height="400"></canvas>
                <div class="canvas-tools">
                    <button id="exportPng" class="btn btn-success">📥 PNG exportieren</button>
                    <button id="clearCanvas" class="btn btn-danger">🗑️ Alles löschen</button>
                </div>
            </div>

            <!-- Toolbox -->
            <aside class="toolbox">
                <div class="tool-section">
                    <h3>➕ Elemente</h3>
                    <div class="button-grid">
                        <button class="btn btn-shape" data-shape="rect">⬜ Rechteck</button>
                        <button class="btn btn-shape" data-shape="circle">⭕ Kreis</button>
                        <button class="btn btn-shape" data-shape="triangle">△ Dreieck</button>
                        <button class="btn btn-shape" data-shape="star">⭐ Stern</button>
                        <button class="btn btn-shape" data-shape="line">〰️ Linie</button>
                        <button class="btn btn-text" id="addText">🔤 Text</button>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>🎨 Eigenschaften</h3>
                    <div class="prop-group">
                        <label>Farbe</label>
                        <input type="color" id="colorPicker" value="#3b82f6" />
                    </div>
                    <div class="prop-group">
                        <label>Größe</label>
                        <input type="range" id="sizeSlider" min="10" max="200" value="60" />
                        <span id="sizeValue">60</span>
                    </div>
                    <div class="prop-group">
                        <label>Drehung</label>
                        <input type="range" id="rotationSlider" min="0" max="360" value="0" />
                        <span id="rotationValue">0°</span>
                    </div>
                    <div class="prop-group">
                        <label>Füllung</label>
                        <div class="radio-group">
                            <label><input type="radio" name="fillType" value="fill" checked /> Gefüllt</label>
                            <label><input type="radio" name="fillType" value="stroke" /> Umriss</label>
                        </div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3>📐 Position</h3>
                    <div class="pos-group">
                        <label>X: <input type="number" id="posX" value="300" step="1" /></label>
                        <label>Y: <input type="number" id="posY" value="200" step="1" /></label>
                    </div>
                    <button id="centerElement" class="btn btn-sm">⬆️ Zentrieren</button>
                </div>

                <div class="tool-section">
                    <h3>📚 Elemente</h3>
                    <div id="layerList" class="layer-list">
                        <p class="empty-message">Noch keine Elemente</p>
                    </div>
                    <div class="layer-actions">
                        <button id="moveUp" class="btn btn-sm">⬆️ Nach vorne</button>
                        <button id="moveDown" class="btn btn-sm">⬇️ Nach hinten</button>
                        <button id="deleteElement" class="btn btn-sm btn-danger">🗑️ Löschen</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
