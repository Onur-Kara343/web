<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Hintergrund - runder Button -->
    <rect width="100" height="100" rx="20" fill="#1a1a2e" />
    
    <!-- Noten-Linien (wie ein Notensystem) -->
    <line x1="15" y1="30" x2="85" y2="30" stroke="#4CAF50" stroke-width="2" opacity="0.5" />
    <line x1="15" y1="38" x2="85" y2="38" stroke="#4CAF50" stroke-width="2" opacity="0.5" />
    <line x1="15" y1="46" x2="85" y2="46" stroke="#4CAF50" stroke-width="2" opacity="0.5" />
    <line x1="15" y1="54" x2="85" y2="54" stroke="#4CAF50" stroke-width="2" opacity="0.5" />
    <line x1="15" y1="62" x2="85" y2="62" stroke="#4CAF50" stroke-width="2" opacity="0.5" />
    
    <!-- Achtel-Noten -->
    <!-- Note 1 -->
    <ellipse cx="25" cy="42" rx="6" ry="4.5" fill="#4CAF50" transform="rotate(-20 25 42)" />
    <line x1="30" y1="42" x2="30" y2="22" stroke="#4CAF50" stroke-width="2.5" />
    <path d="M30 22 Q36 24 38 30" stroke="#4CAF50" stroke-width="2.5" fill="none" />
    
    <!-- Note 2 -->
    <ellipse cx="50" cy="50" rx="6" ry="4.5" fill="#4CAF50" transform="rotate(-20 50 50)" />
    <line x1="55" y1="50" x2="55" y2="30" stroke="#4CAF50" stroke-width="2.5" />
    <path d="M55 30 Q61 32 63 38" stroke="#4CAF50" stroke-width="2.5" fill="none" />
    
    <!-- Note 3 (umgedrehte Achtelnote) -->
    <ellipse cx="75" cy="38" rx="6" ry="4.5" fill="#4CAF50" transform="rotate(-20 75 38)" />
    <line x1="70" y1="38" x2="70" y2="18" stroke="#4CAF50" stroke-width="2.5" />
    <path d="M70 18 Q64 20 62 26" stroke="#4CAF50" stroke-width="2.5" fill="none" />
    
    <!-- Play-Button Dreieck in der Mitte (als Akzent) -->
    <polygon points="48,30 48,62 68,46" fill="#4CAF50" opacity="0.15" />
    
    <!-- Glanz-Effekt -->
    <circle cx="20" cy="20" r="8" fill="white" opacity="0.05" />
</svg>