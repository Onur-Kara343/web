<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e93"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="grad-wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2e93"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad-wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>

  <!-- Subtiler Rahmen -->
  <rect x="1" y="1" width="62" height="62" rx="13"
        fill="none"
        stroke="url(#grad)"
        stroke-width="1.5"
        opacity="0.4"/>

  <!-- Audio-Wellen links (Pink → Violett) -->
  <rect x="12" y="24" width="3" height="16" rx="1.5" fill="url(#grad-wave)"/>
  <rect x="18" y="18" width="3" height="28" rx="1.5" fill="url(#grad-wave)"/>

  <!-- Mittlere Welle (Hauptteil, Pink → Cyan) -->
  <rect x="25" y="14" width="4" height="36" rx="2" fill="url(#grad)"/>
  <rect x="31" y="20" width="4" height="24" rx="2" fill="url(#grad)"/>
  <rect x="37" y="12" width="4" height="40" rx="2" fill="url(#grad)"/>

  <!-- Audio-Wellen rechts (Cyan → Violett) -->
  <rect x="44" y="22" width="3" height="20" rx="1.5" fill="url(#grad-wave2)"/>
  <rect x="50" y="18" width="3" height="28" rx="1.5" fill="url(#grad-wave2)"/>

  <!-- Glow-Punkte oben und unten -->
  <circle cx="32" cy="6" r="1.5" fill="#ff2e93" opacity="0.8"/>
  <circle cx="32" cy="58" r="1.5" fill="#00e5ff" opacity="0.8"/>
</svg>