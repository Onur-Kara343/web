version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qry-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - qry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: qry-backend
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: qry_db
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID}
      LEMON_SQUEEZY_PRODUCT_ID: ${LEMON_SQUEEZY_PRODUCT_ID}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qry-network
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    command: sh -c "npm install && node server.js & serve -s ../frontend -l 3000"

volumes:
  postgres_data:

networks:
  qry-network:
    driver: bridge