<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ Voxify - KI Podcast Generator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="logo">
                <span class="logo-icon">🎙️</span>
                <h1>Voxify</h1>
            </div>
            <p class="subtitle">Dein Skript → Natürlicher Podcast</p>
            <div class="badge-container">
                <span class="badge">⚡ Google Cloud TTS</span>
                <span class="badge">🎤 2 Stimmen</span>
                <span class="badge">📊 4M Zeichen gratis</span>
            </div>
        </header>

        <!-- SKRIPT EINGABE -->
        <div class="script-section">
            <div class="script-header">
                <label for="scriptInput">📝 Dein Skript</label>
                <div class="script-actions">
                    <span id="charCount">0 Zeichen</span>
                    <button onclick="loadExample()" class="example-btn">📄 Beispiel laden</button>
                    <button onclick="document.getElementById('fileInput').click()" class="upload-btn">📤 Datei hochladen</button>
                    <input type="file" id="fileInput" accept=".txt,.md" style="display:none">
                </div>
            </div>
            <textarea id="scriptInput" placeholder="Schreibe dein Podcast-Skript hier... 

Beispiel:
Host: Willkommen zu einer neuen Folge!
Gast: Danke für die Einladung!
Host: Heute sprechen wir über KI und Podcasts.
Gast: Ein spannendes Thema, lass uns loslegen!"></textarea>
        </div>

        <!-- STIMMEN AUSWAHL -->
        <div class="voices-section">
            <h3>🎤 Stimmen auswählen</h3>
            <div class="voice-selectors">
                <div class="voice-group">
                    <label>Host-Stimme</label>
                    <select id="hostVoice">
                        <optgroup label="🇺🇸 Englisch (US)">
                            <option value="en-US-Neural2-D">en-US-Neural2-D (männlich)</option>
                            <option value="en-US-Neural2-F" selected>en-US-Neural2-F (weiblich)</option>
                            <option value="en-US-Neural2-J">en-US-Neural2-J (männlich)</option>
                            <option value="en-US-Neural2-C">en-US-Neural2-C (weiblich)</option>
                        </optgroup>
                        <optgroup label="🇬🇧 Englisch (UK)">
                            <option value="en-GB-Neural2-A">en-GB-Neural2-A (weiblich)</option>
                            <option value="en-GB-Neural2-B">en-GB-Neural2-B (männlich)</option>
                        </optgroup>
                        <optgroup label="🇩🇪 Deutsch">
                            <option value="de-DE-Neural2-C">de-DE-Neural2-C (weiblich)</option>
                            <option value="de-DE-Neural2-D">de-DE-Neural2-D (männlich)</option>
                            <option value="de-DE-Neural2-F">de-DE-Neural2-F (weiblich)</option>
                        </optgroup>
                        <optgroup label="🇫🇷 Französisch">
                            <option value="fr-FR-Neural2-A">fr-FR-Neural2-A (weiblich)</option>
                            <option value="fr-FR-Neural2-C">fr-FR-Neural2-C (männlich)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="voice-group">
                    <label>Gast-Stimme</label>
                    <select id="guestVoice">
                        <optgroup label="🇺🇸 Englisch (US)">
                            <option value="en-US-Neural2-D">en-US-Neural2-D (männlich)</option>
                            <option value="en-US-Neural2-F" selected>en-US-Neural2-F (weiblich)</option>
                            <option value="en-US-Neural2-J">en-US-Neural2-J (männlich)</option>
                            <option value="en-US-Neural2-C">en-US-Neural2-C (weiblich)</option>
                        </optgroup>
                        <optgroup label="🇬🇧 Englisch (UK)">
                            <option value="en-GB-Neural2-A">en-GB-Neural2-A (weiblich)</option>
                            <option value="en-GB-Neural2-B">en-GB-Neural2-B (männlich)</option>
                        </optgroup>
                        <optgroup label="🇩🇪 Deutsch">
                            <option value="de-DE-Neural2-C">de-DE-Neural2-C (weiblich)</option>
                            <option value="de-DE-Neural2-D">de-DE-Neural2-D (männlich)</option>
                            <option value="de-DE-Neural2-F">de-DE-Neural2-F (weiblich)</option>
                        </optgroup>
                        <optgroup label="🇫🇷 Französisch">
                            <option value="fr-FR-Neural2-A">fr-FR-Neural2-A (weiblich)</option>
                            <option value="fr-FR-Neural2-C">fr-FR-Neural2-C (männlich)</option>
                        </optgroup>
                    </select>
                </div>
            </div>
        </div>

        <!-- EINSTELLUNGEN -->
        <div class="settings-section">
            <h3>⚙️ Einstellungen</h3>
            <div class="settings-grid">
                <div class="setting-group">
                    <label>🔊 Geschwindigkeit</label>
                    <input type="range" id="speed" min="0.5" max="2.0" value="1.0" step="0.05">
                    <span class="setting-value" id="speedValue">1.0x</span>
                </div>
                <div class="setting-group">
                    <label>🎯 Sprechpause (s)</label>
                    <input type="range" id="pause" min="0.1" max="2.0" value="0.5" step="0.1">
                    <span class="setting-value" id="pauseValue">0.5s</span>
                </div>
                <div class="setting-group">
                    <label>🗣️ Stimmung</label>
                    <select id="mood">
                        <option value="neutral">Neutral</option>
                        <option value="enthusiastic">Enthusiastisch</option>
                        <option value="calm">Ruhig</option>
                        <option value="professional">Professionell</option>
                        <option value="friendly">Freundlich</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- ACTIONS -->
        <div class="actions">
            <button class="generate-btn" id="generateBtn" onclick="generatePodcast()">
                🎙️ Podcast generieren
            </button>
            <button class="reset-btn" onclick="resetAll()">
                🔄 Zurücksetzen
            </button>
        </div>

        <!-- STATUS -->
        <div id="status" class="status">📝 Schreibe dein Skript oder lade ein Beispiel</div>

        <!-- PLAYER -->
        <div class="player" id="player" style="display:none;">
            <div class="player-title">🎧 Podcast abspielen</div>
            <audio id="audioPlayer" controls></audio>
            <div class="player-actions">
                <button class="download-btn" onclick="downloadPodcast()">
                    📥 Podcast herunterladen (MP3)
                </button>
                <button class="transcript-btn" onclick="showTranscript()">
                    📄 Transkript anzeigen
                </button>
            </div>
            <div id="transcriptDisplay" class="transcript-display" style="display:none;"></div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <span>⚡ Google Cloud TTS · 4M Zeichen/Monat gratis</span>
            <span>🎙️ Voxify v1.0</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
