<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Finanz-Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-line"></i> Finanz-Tracker</h1>
            <p>Deine persönliche Finanzübersicht mit Spar-Challenges & KI-Tipps</p>
        </header>

        <!-- Login/Register Bereich -->
        <div id="login-container">
            <div class="login-card">
                <h2><i class="fas fa-user-lock"></i> Finanz-Tracker Login</h2>
                
                <div id="login-form" class="auth-form active">
                    <input type="email" id="login-email" placeholder="E-Mail" required>
                    <input type="password" id="login-password" placeholder="Passwort" required>
                    <button id="login-btn" class="btn-primary">Anmelden</button>
                    <p class="auth-switch">
                        Noch kein Konto? <a href="#" id="show-register">Registrieren</a>
                    </p>
                </div>
                
                <div id="register-form" class="auth-form">
                    <input type="text" id="register-username" placeholder="Benutzername" required>
                    <input type="email" id="register-email" placeholder="E-Mail" required>
                    <input type="password" id="register-password" placeholder="Passwort" required>
                    <button id="register-btn" class="btn-primary">Registrieren</button>
                    <p class="auth-switch">
                        Bereits registriert? <a href="#" id="show-login">Anmelden</a>
                    </p>
                </div>
                
                <div id="auth-error" class="error-message"></div>
            </div>
        </div>

        <footer>
            <p>💰 Finanz-Tracker | Deine Ausgaben im Blick | Spar-Challenges | KI-Tipps</p>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
