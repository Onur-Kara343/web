<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>📱 QR-Code Tool – Generieren & Scannen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 QR-Code Tool</h1>
            <p>Generieren & Scannen – Text, URL, WLAN, Telefon</p>
        </header>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="generate">✨ Generieren</button>
            <button class="tab-btn" data-tab="scan">📷 Scannen</button>
        </div>

        <!-- ========== GENERATE TAB ========== -->
        <div id="tab-generate" class="tab-content active">
            <div class="card">
                <div class="type-selector">
                    <button class="type-btn active" data-type="text">📝 Text</button>
                    <button class="type-btn" data-type="url">🔗 URL</button>
                    <button class="type-btn" data-type="wifi">📶 WLAN</button>
                    <button class="type-btn" data-type="phone">📞 Telefon</button>
                </div>

                <!-- Text/URL Feld -->
                <div id="text-url-group" class="input-group">
                    <label>📝 Text / URL</label>
                    <textarea id="content-input" rows="3" placeholder="Gib deinen Text oder URL ein..."></textarea>
                </div>

                <!-- WLAN Felder (versteckt) -->
                <div id="wifi-group" class="input-group hidden">
                    <label>📶 WLAN Name (SSID)</label>
                    <input type="text" id="wifi-ssid" placeholder="z.B. MeinWLAN">
                    <label style="margin-top: 12px;">🔑 Passwort</label>
                    <input type="text" id="wifi-password" placeholder="Passwort">
                    <label style="margin-top: 12px;">🛡️ Verschlüsselung</label>
                    <select id="wifi-encryption">
                        <option value="WPA">WPA/WPA2</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">Kein Passwort</option>
                    </select>
                </div>

                <!-- Telefon Feld (versteckt) -->
                <div id="phone-group" class="input-group hidden">
                    <label>📞 Telefonnummer</label>
                    <input type="tel" id="phone-number" placeholder="+49 123 456789">
                </div>

                <button id="generate-btn" class="btn-primary">🎯 QR-Code generieren</button>

                <div id="qr-result" class="qr-result hidden">
                    <img id="qr-image" alt="QR Code">
                    <div class="result-buttons">
                        <button id="download-btn" class="btn-secondary">💾 Download</button>
                        <button id="copy-btn" class="btn-secondary">📋 Inhalt kopieren</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== SCAN TAB ========== -->
        <div id="tab-scan" class="tab-content">
            <div class="card">
                <div class="scan-options">
                    <button id="start-camera-btn" class="btn-primary">📷 Kamera starten</button>
                    <button id="stop-camera-btn" class="btn-secondary hidden">⏹️ Kamera stoppen</button>
                </div>
                
                <div id="camera-container" class="camera-container hidden">
                    <video id="camera-preview" playsinline></video>
                    <div id="scan-result" class="scan-result hidden">
                        <h3>✅ Ergebnis</h3>
                        <p id="scanned-content"></p>
                        <button id="use-scanned-btn" class="btn-secondary">📋 Übernehmen zum Generieren</button>
                    </div>
                </div>

                <div class="divider">oder</div>

                <div class="upload-area">
                    <label for="upload-file" class="upload-label">📁 Bild hochladen</label>
                    <input type="file" id="upload-file" accept="image/*" hidden>
                    <div id="upload-result" class="scan-result hidden">
                        <h3>✅ Ergebnis</h3>
                        <p id="upload-scanned-content"></p>
                        <button id="use-upload-btn" class="btn-secondary">📋 Übernehmen zum Generieren</button>
                    </div>
                </div>
            </div>
        </div>

    <!-- HTML5 QR Code Bibliothek -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
